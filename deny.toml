# cargo-deny configuration for Math Equation Editor & Converter
# Enforces strict permissive / MIT-compatible license compliance across the workspace

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # Transitive Linux accessibility deps pulled by eframe -> egui-winit -> accesskit_unix -> atspi -> zbus 5.x.
    # Merged into zbus 6.0.0 upstream; revisit once eframe/accesskit updates to zbus 6+ (note: zbus 5.19 stays transitive until then).
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6.0.0; transitive via eframe/accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6.0.0; transitive via eframe/accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6.0.0; transitive via eframe/accesskit_unix" },
]

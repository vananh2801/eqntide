# cargo-deny configuration for Math Equation Editor & Converter
# Enforces strict permissive / MIT-compatible license compliance across the workspace

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# cargo-deny now configures these checks by dependency scope rather than lint
# level. Keep unmaintained crates non-blocking and reject unsound crates anywhere
# in the dependency graph.
unmaintained = "none"
unsound = "all"
yanked = "warn"

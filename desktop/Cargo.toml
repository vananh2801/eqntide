[package]
name = "eqntide-desktop"
version = "0.6.1"
edition = "2021"
description = "EqnTide: Bidirectional math equation converter & editor between Word OMML, LaTeX, and MathType"
license = "MIT"
authors = ["Anh"]
repository = "https://github.com/vananh2801/eqntide"
publish = false

[dependencies]
eqntide = { path = ".." }
eqntide-editor = { path = "../crates/eqntide-editor" }
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu", "x11", "wayland", "accesskit", "default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["accesskit", "wayland", "x11"] }
pollster = "1"
winit = { version = "0.30", default-features = false }
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess = "2.4"
fs2 = "0.4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EqnTide progress</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; padding: 3px 10px; font: 13px/18px system-ui, sans-serif; }
    #progress { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="progress" role="status"></div>
  <script>
    var progress = document.getElementById("progress");
    function refreshProgress() {
      var message = wps.PluginStorage.getItem("eqntide.toggleProgress") || "";
      if (progress.textContent !== message) progress.textContent = message;
    }
    refreshProgress();
    setInterval(refreshProgress, 250);
  </script>
</body>
</html>

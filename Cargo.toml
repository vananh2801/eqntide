[package]
name = "eqntide"
version = "0.3.0"
edition = "2021"
description = "EqnTide: Bidirectional math equation converter & editor between Word OMML, LaTeX, and MathType"
readme = "README.md"
license = "MIT"
authors = ["Anh"]
keywords = ["omml", "mathtype", "latex", "docx", "mathml"]
categories = ["command-line-utilities", "text-processing", "parser-implementations"]
repository = "https://github.com/vananh2801/eqntide"

[lib]
name = "eqntide"
path = "src/lib.rs"

[[bin]]
name = "eqntide-cli"
path = "src/main.rs"

[dependencies]
quick-xml = "0.31"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
ttf-parser = "0.25"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
latex2mathml = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

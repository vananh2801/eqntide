[workspace]
members = [".", "crates/eqntide-editor", "desktop"]
default-members = ["."]
resolver = "2"

[package]
name = "eqntide"
version = "1.1.0"
edition = "2021"
description = "EqnTide: Bidirectional math equation converter & editor between Word OMML, LaTeX, and MathType"
readme = "README.md"
license = "MIT"
authors = ["Anh"]
keywords = ["omml", "mathtype", "latex", "docx", "mathml"]
categories = ["command-line-utilities", "text-processing", "parser-implementations"]
repository = "https://github.com/vananh2801/eqntide"

[lib]
name = "eqntide"
path = "src/lib.rs"

[[bin]]
name = "eqntide-cli"
path = "src/main.rs"

[dependencies]
quick-xml = "0.41"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
ab_glyph_rasterizer = "0.1"
read-fonts = "0.47"
skrifa = "0.50"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
latex2mathml = "0.2.3"
directories = "4.0.1"
rayon = "1"

[profile.dev.package.hdrshot-egui-backend]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

name: Native preview packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Native preview - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build and package dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev pkg-config rpm
      - name: Build native desktop and CLI
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python scripts/package_native.py --target ${{ matrix.target }} --format all
      - name: Package Windows/macOS
        if: runner.os != 'Linux'
        run: python scripts/package_native.py --target ${{ matrix.target }}
      - name: Build NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --no-progress -y }
          & $nsis scripts/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item release/EqnTide-Setup.exe dist/EqnTide-Native-Preview-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: eqntide-native-preview-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.exe
      - name: Publish preview assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.exe

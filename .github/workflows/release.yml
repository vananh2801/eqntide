# Release checklist:
# 1. Bump matching `X.Y.Z` versions across `Cargo.toml`, `desktop/Cargo.toml`,
#    and `crates/eqntide-editor/Cargo.toml` (keep `Cargo.toml` without `-beta`
#    suffixes so `.deb`/`.rpm` packaging and desktop SemVer checks remain valid).
# 2. Push tag:
#    - `vX.Y.Z` (no hyphen)  -> stable release (`prerelease: false`, updates Latest)
#    - `vX.Y.Z-beta.1` (`-`) -> pre-release (`prerelease: true`, skips Latest)
name: Native preview release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-native.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eqntide-native-preview-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/*/*/*.zip
            dist/*/*/*.tar.gz
            dist/*/*/*.deb
            dist/*/*/*.rpm
            dist/*/*/*.exe
            dist/*/*/README-*.txt

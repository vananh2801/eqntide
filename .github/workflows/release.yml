name: Native preview release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-native.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eqntide-native-preview-*
          path: dist
          merge-multiple: true
      - name: Publish preview assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            dist/*/*/*.zip
            dist/*/*/*.tar.gz
            dist/*/*/*.deb
            dist/*/*/*.rpm
            dist/*/*/*.exe
            dist/*/*/README-*.txt

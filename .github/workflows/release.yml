name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: omml-converter
            asset_name: omml-converter-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: omml-converter.exe
            asset_name: omml-converter-windows-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: omml-converter
            asset_name: omml-converter-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: omml-converter
            asset_name: omml-converter-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          STAGING="omml-converter-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${{ matrix.asset_name }}.zip" "$STAGING"
          else
            tar czvf "${{ matrix.asset_name }}.tar.gz" "$STAGING"
          fi

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.zip
            *.tar.gz

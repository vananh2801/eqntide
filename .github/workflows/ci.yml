name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'src/**'
      - 'crates/**'
      - 'desktop/**'
      - 'tests/**'
      - 'assets/**'
      - 'scripts/**'
      - 'wps-addin/**'
      - 'word-template/**'
      - '.github/workflows/**'
      - '.cargo/**'
      - 'docs/**'
      - 'README.md'
      - 'NOTICE'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native workspace - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install Linux native build dependencies (no WebKit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Python packaging checks
        run: |
          python -m pip install -r word-template/test-requirements.txt
          python -m py_compile scripts/package_native.py
          python -m unittest discover -s tests/python -p "test_*.py"
      - name: Add-in JavaScript syntax & WPS tests
        run: |
          node --check wps-addin/main.js
          node --check wps-addin/taskpane.js
          npm ci --prefix tests/wps
          npm test --prefix tests/wps
      - name: Windows installer script syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

  licenses:
    name: Workspace dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --workspace --locked
          command-arguments: advisories licenses bans sources

  packages:
    name: Native distribution packages
    needs: [test, licenses]
    uses: ./.github/workflows/build-native.yml

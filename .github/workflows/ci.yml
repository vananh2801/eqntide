name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'src/**'
      - 'crates/**'
      - 'desktop/**'
      - 'assets/**'
      - 'scripts/**'
      - 'wps-addin/**'
      - 'word-template/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native workspace - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux native build dependencies (no WebKit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Python packaging checks
        run: |
          python -m py_compile scripts/package_native.py
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Add-in JavaScript syntax
        run: |
          node --check wps-addin/main.js
      - name: Build native desktop and CLI
        run: cargo build --workspace --locked
      - name: Executable smoke test
        run: cargo run -p eqntide-desktop --locked -- --version

  licenses:
    name: Workspace dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: licenses bans sources
